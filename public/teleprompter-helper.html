<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamWorks Teleprompter</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 14px;
        overflow: hidden;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: transparent;
        color: #fff;
      }
      .wrap {
        height: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-radius: 14px;
        border: 0;
        background: transparent;
        backdrop-filter: none;
        overflow: hidden;
        opacity: 0.68;
      }
      .titlebar {
        flex-shrink: 0;
        height: 28px;
        border-radius: 14px 14px 0 0;
        background: rgba(255,255,255,.28);
        border: 1px solid rgba(255,255,255,.45);
        cursor: move;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(0,0,0,.78);
        font-size: 12px;
        font-weight: 700;
        app-region: drag;
        -webkit-app-region: drag;
      }
      .controls {
        flex-shrink: 0;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: nowrap;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,.18);
        background: rgba(2, 6, 23, 0.62);
      }
      #close {
        margin-left: auto;
        app-region: no-drag;
        -webkit-app-region: no-drag;
      }
      button, input { font: inherit; }
      button {
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 7px;
        background: rgba(255,255,255,.1);
        color: #fff;
        padding: 5px 9px;
        cursor: pointer;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 80px;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 0 0 14px 14px;
        overflow: hidden;
        background: rgba(2,8,24,.55);
      }
      .fade-top, .fade-bottom {
        position: absolute; left: 0; right: 0; height: 36px; pointer-events: none; z-index: 2;
      }
      .fade-top { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0)); }
      .fade-bottom { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,0)); }
      .focus {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%); height: 48px;
        border-top: 1px solid rgba(110,231,183,.45);
        border-bottom: 1px solid rgba(110,231,183,.45);
        background: rgba(110,231,183,.1);
        pointer-events: none; z-index: 2;
      }
      .viewport {
        height: 100%;
        overflow: hidden;
        text-align: center;
        padding: 14px;
      }
      .script {
        white-space: pre-wrap;
        line-height: 1.55;
        transform: translateY(0);
        color: rgba(255,255,255,.96);
        text-shadow: 0 1px 2px rgba(0,0,0,.35);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="titlebar" data-tauri-drag-region>Drag Teleprompter</div>
      <div class="controls">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
        <label>Speed <input id="speed" type="range" min="10" max="180" step="2" value="42" /></label>
        <button id="close">Close</button>
      </div>
      <div class="panel" id="panel">
        <div class="fade-top"></div>
        <div class="fade-bottom"></div>
        <div class="focus"></div>
        <div class="viewport" id="viewport">
          <div id="script" class="script"></div>
        </div>
      </div>
    </div>
    <script>
      const channel = new BroadcastChannel("dreamwork-teleprompter");
      const viewport = document.getElementById("viewport");
      const scriptEl = document.getElementById("script");
      const speedEl = document.getElementById("speed");
      const playBtn = document.getElementById("play");
      const pauseBtn = document.getElementById("pause");
      const resetBtn = document.getElementById("reset");
      const closeBtn = document.getElementById("close");
      const dragBar = document.querySelector(".titlebar");

      let state = { script: "", playing: false, speed: 42, fontSize: 32, opacity: 0.68, resetSeq: 0 };
      let scrollPx = 0;
      let lastTs = 0;

      function applyState() {
        scriptEl.textContent = state.script || "Teleprompter ready...";
        scriptEl.style.fontSize = `${state.fontSize || 32}px`;
        document.querySelector(".wrap").style.opacity = `${state.opacity ?? 0.68}`;
        speedEl.value = String(state.speed || 42);
      }

      function publishControl(payload) {
        channel.postMessage({ type: "teleprompter-control", ...payload });
      }

      playBtn.onclick = () => publishControl({ playing: true });
      pauseBtn.onclick = () => publishControl({ playing: false });
      resetBtn.onclick = () => {
        scrollPx = 0;
        scriptEl.style.transform = "translateY(0px)";
        publishControl({ resetSeq: state.resetSeq + 1, playing: false });
      };
      speedEl.oninput = () => publishControl({ speed: Number(speedEl.value) });
      closeBtn.onclick = () => {
        channel.postMessage({ type: "teleprompter-close" });
        if (window.close) window.close();
      };
      if (dragBar) {
        dragBar.addEventListener("pointerdown", () => {
          // Drag handled natively by app-region drag.
        });
      }

      channel.onmessage = (event) => {
        const data = event.data || {};
        if (data.type !== "teleprompter-state") return;
        state = { ...state, ...data };
        applyState();
      };

      function tick(ts) {
        if (state.playing) {
          const dt = lastTs ? (ts - lastTs) / 1000 : 0;
          scrollPx += (state.speed || 42) * dt;
          const maxScroll = Math.max(0, scriptEl.scrollHeight - viewport.clientHeight);
          if (scrollPx >= maxScroll) scrollPx = maxScroll;
          scriptEl.style.transform = `translateY(${-scrollPx}px)`;
        }
        lastTs = ts;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
