
services:
  - type: web
    name: dreamwork-signaling
    runtime: node
    buildCommand: npm install
    startCommand: node server/signaling-server.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: dreamwork
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Hardcoded so signaling URL is available at static site build time.
      # fromService/RENDER_EXTERNAL_URL can be empty during parallel builds.
      - key: VITE_SIGNALING_URL
        value: https://dreamwork-signaling.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
